<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#16244d"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#070a14"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="good" x1="0" x2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- a KPI that climbs after a bad deploy, then drops back after the rollback -->
  <g transform="translate(0,62)">
    <line x1="560" y1="20" x2="560" y2="220" stroke="#fbbf24" stroke-opacity="0.45" stroke-dasharray="4 5"/>
    <line x1="900" y1="20" x2="900" y2="220" stroke="#34d399" stroke-opacity="0.45" stroke-dasharray="4 5"/>
    <path d="M0 200 L80 198 L160 201 L240 197 L320 200 L400 198 L480 201 L560 199
             C620 196 650 150 700 110 S800 60 850 52 L900 50"
          fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    <path d="M900 50 L900 50 C915 120 930 190 960 197 L1040 199 L1120 198 L1200 200"
          fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <circle cx="900" cy="50" r="6" fill="#f87171"/>
    <circle cx="900" cy="50" r="14" fill="none" stroke="#f87171" stroke-opacity="0.35"/>
  </g>

  <text x="64" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#e8ecf8">nexus-ai</text>
  <text x="66" y="170" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9aa6c4">detect · explain · fix — with a human in the loop</text>
  <text x="66" y="212" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" fill="#5f6b8a">C call-log analyzer  ·  KPI anomaly detection  ·  Claude RCA  ·  DevSecOps agent</text>
</svg>
